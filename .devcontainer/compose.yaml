x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VARIANT: 3.12-bullseye
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
  volumes:
    - ..:/workspace:rw
    - ${HOME}/.aws:/home/vscode/.aws:ro
  working_dir: /workspace
  command: ["sleep", "infinity"]
  environment:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    NO_PROXY: ${NO_PROXY:-}
    no_proxy: ${no_proxy:-}
  env_file:
    - path: .env
      required: false
  tty: true
  user: vscode
  userns_mode: keep-id

services:
  dev:
    <<: *common
    image: localhost/claude-code-sample:dev-${USER}
