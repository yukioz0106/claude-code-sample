<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENEOS Management Dashboard — 統合KPI一覧</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080C12;--surface:#0F1520;--card:#111826;--border:#1A2840;
  --text:#E2EAF4;--muted:#6B7FA0;--blue:#4A9EFF;--cyan:#22D3EE;
  --green:#34D399;--yellow:#FBBF24;--red:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-size:13px;line-height:1.5;min-width:1100px;}

.header{background:linear-gradient(135deg,#060D1E,#0C1830 55%,#07112A);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:20px;}
.eneos-logo{width:92px;height:38px;background:linear-gradient(135deg,#003580,#0051C8);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;letter-spacing:1.5px;color:#fff;border:1px solid rgba(74,158,255,0.4);box-shadow:0 0 18px rgba(0,80,200,0.4);flex-shrink:0;}
.header-titles{flex:1;margin-left:14px;}
.header-main{font-size:20px;font-weight:700;background:linear-gradient(90deg,#4A9EFF,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:18px;}
.period-sel-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.period-sel{background:#0B1525;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;}

.main{padding:16px 28px;}
.sec-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.sec-label::before{content:'';display:block;width:3px;height:14px;background:var(--blue);border-radius:2px;}

.hd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px;}
.hd-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s;}
.hd-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4);}
.hd-card-top{height:2px;margin:-10px -12px 8px;width:calc(100%+24px);}
.hd-co-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.hd-profit{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
.hd-budget{font-size:10px;color:var(--muted);margin-top:1px;}
.hd-prog{font-size:11px;font-weight:700;margin-top:3px;}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.sdot.g{background:var(--green);box-shadow:0 0 5px var(--green);}
.sdot.y{background:var(--yellow);box-shadow:0 0 5px var(--yellow);}
.sdot.r{background:var(--red);box-shadow:0 0 5px var(--red);animation:blink 1.4s infinite;}
.sdot.nd{background:#2a3858;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filter-label{font-size:11px;color:var(--muted);margin-right:4px;}
.filter-btn{padding:4px 14px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;}
.filter-btn:hover{border-color:var(--blue);color:var(--text);}
.filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.search-wrap{margin-left:auto;position:relative;}
.search-input{background:#0B1525;border:1px solid var(--border);color:var(--text);padding:5px 10px 5px 28px;border-radius:6px;font-size:12px;width:200px;}
.search-input::placeholder{color:#3a5070;}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#3a5070;font-size:12px;pointer-events:none;}

.table-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.row-count{font-size:11px;color:var(--muted);}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
.kpi-table{width:100%;border-collapse:collapse;font-size:12px;}
.kpi-table thead{position:sticky;top:0;z-index:10;}
.kpi-table th{background:#0A1422;color:var(--muted);padding:9px 12px;text-align:right;font-weight:700;font-size:11px;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap;}
.kpi-table th:nth-child(1),.kpi-table th:nth-child(2),.kpi-table th:nth-child(3),.kpi-table th:nth-child(4),.kpi-table th:nth-child(5){text-align:left;}
.kpi-table th:nth-child(1){width:90px;}
.kpi-table th:nth-child(2){width:50px;}
.kpi-table th:nth-child(3){width:110px;}
.kpi-table th:nth-child(4){min-width:160px;}
.kpi-table th:nth-child(5){width:65px;}

.kpi-table td{padding:8px 12px;border-bottom:1px solid #0D1828;text-align:right;color:#B0C4D8;vertical-align:middle;white-space:nowrap;}
.kpi-table td:nth-child(1),.kpi-table td:nth-child(2),.kpi-table td:nth-child(3){text-align:left;}
.kpi-table td:nth-child(4){text-align:left;color:var(--text);font-weight:500;}
.kpi-table td:nth-child(5){text-align:left;color:var(--muted);font-size:10px;}

.kpi-table tbody tr{cursor:pointer;transition:background .1s;}
.kpi-table tbody tr:hover td{background:#0D1A2E;}
.kpi-table tbody tr.nodata-row{opacity:.45;cursor:default;}
.kpi-table tbody tr.nodata-row:hover td{background:transparent;}
.kpi-table tbody tr.co-group-start td{border-top:2px solid #1E2E48;}

.co-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.5px;}
.num-act{color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:600;}
.num-bud{color:var(--muted);font-variant-numeric:tabular-nums;}
.num-diff.pos{color:var(--green);}
.num-diff.neg{color:var(--red);}
.num-diff.zero{color:var(--muted);}
.num-prog.g{color:var(--green);font-weight:700;}
.num-prog.y{color:var(--yellow);font-weight:700;}
.num-prog.r{color:var(--red);font-weight:700;}
.num-prog.nd{color:#3a4a6a;}
.prog-mini{display:inline-block;width:52px;height:4px;background:#1A2840;border-radius:2px;vertical-align:middle;margin-left:5px;overflow:hidden;}
.prog-mini-fill{height:100%;border-radius:2px;}
.prog-mini-fill.g{background:linear-gradient(90deg,#059669,#34D399);}
.prog-mini-fill.y{background:linear-gradient(90deg,#D97706,#FBBF24);}
.prog-mini-fill.r{background:linear-gradient(90deg,#DC2626,#F87171);}
.avg-badge{font-size:9px;background:#1a2840;color:#5577aa;border-radius:3px;padding:1px 4px;margin-left:4px;}
.low-badge{font-size:9px;background:#1a2840;color:#6B7FA0;border-radius:3px;padding:1px 4px;margin-left:4px;}
.nodata-cell{color:#2a3858;font-size:11px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,5,20,.82);z-index:1000;overflow-y:auto;padding:32px 20px;}
.modal-overlay.open{display:block;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:920px;margin:0 auto;box-shadow:0 24px 80px rgba(0,0,0,.7);}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.modal-title{font-size:15px;font-weight:700;}
.modal-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.modal-close{background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:5px 14px;border-radius:6px;font-size:13px;flex-shrink:0;}
.modal-close:hover{border-color:var(--red);color:var(--red);}
.modal-body{padding:22px 24px;}
.chart-wrap{position:relative;width:100%;}
.chart-wrap.h280{height:280px;}
.chart-wrap.h220{height:220px;}
.chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;}
.chart-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
.chart-sec-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
.modal-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:18px;}
.modal-table th{background:#0B1525;color:var(--muted);padding:8px 12px;text-align:right;font-weight:600;}
.modal-table th:first-child{text-align:left;}
.modal-table td{padding:7px 12px;border-bottom:1px solid #111C2C;text-align:right;color:#B0C4D8;}
.modal-table td:first-child{text-align:left;color:var(--muted);}
.modal-table tr:hover td{background:#0D1A2C;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:#1E2B3E;border-radius:3px;}
</style>
</head>
<body>

<div class="header">
  <div class="eneos-logo">ENEOS</div>
  <div class="header-titles">
    <div class="header-main">Management Dashboard — 統合KPI一覧</div>
    <div class="header-sub">ENEOS Holdings &nbsp;|&nbsp; 経営管理ダッシュボード &nbsp;|&nbsp; FY2025 月次実績管理（全社一覧）</div>
  </div>
  <div class="header-right">
    <div class="period-sel-wrap">
      <span>期間：</span>
      <select class="period-sel" id="periodSel" onchange="onPeriodChange()"></select>
    </div>
    <div style="font-size:11px;color:var(--muted)" id="updTime"></div>
  </div>
</div>

<div class="main">
  <div class="sec-label">HD 主要事業会社別 営業利益サマリー（FY累計）</div>
  <div class="hd-grid" id="hdGrid"></div>

  <div class="sec-label">全社 KPI 統合一覧</div>

  <div class="filter-bar">
    <span class="filter-label">絞り込み：</span>
    <button class="filter-btn active" id="fb_ALL"  onclick="setFilter('ALL',this)">全社</button>
    <button class="filter-btn"        id="fb_HD"   onclick="setFilter('HD',this)">HD</button>
    <button class="filter-btn"        id="fb_ENEOS" onclick="setFilter('ENEOS',this)">ENEOS</button>
    <button class="filter-btn"        id="fb_Xplora" onclick="setFilter('Xplora',this)">Xplora</button>
    <button class="filter-btn"        id="fb_マテリアル" onclick="setFilter('マテリアル',this)">マテリアル</button>
    <button class="filter-btn"        id="fb_Power" onclick="setFilter('Power',this)">Power</button>
    <button class="filter-btn"        id="fb_ERE"  onclick="setFilter('ERE',this)">ERE</button>
    <button class="filter-btn"        id="fb_その他" onclick="setFilter('その他',this)">その他</button>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="指標名で検索…" oninput="renderTable()">
    </div>
  </div>

  <div class="table-meta">
    <span class="row-count" id="rowCount"></span>
    <span style="font-size:10px;color:#2a3858">▶ 行クリックで詳細グラフを表示</span>
  </div>

  <div class="table-wrap">
    <table class="kpi-table">
      <thead>
        <tr>
          <th>会社</th>
          <th>区分</th>
          <th>カテゴリ</th>
          <th>指標名</th>
          <th>単位</th>
          <th>実績</th>
          <th>予算</th>
          <th>差異</th>
          <th>進捗率</th>
          <th style="text-align:center">判定</th>
        </tr>
      </thead>
      <tbody id="kpiTbody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="bgClose(event)">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕ 閉じる</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

// ===== HELPERS =====
function calcProg(act,bud,low=false){
  if(bud==null||isNaN(bud)) return NaN;
  if(bud===0) return act>0?110:(act===0?100:0);
  if(low){
    if(act===0&&bud>0) return 110;
    if(act===0&&bud===0) return 100;
    if(act<0) return NaN;
    return (bud/act)*100;
  }
  if(bud<0&&act<=0) return (bud/act)*100;
  if(bud<0&&act>0)  return 110;
  return (act/bud)*100;
}
function sig(p){ if(isNaN(p)||p==null) return 'nd'; return p>=100?'g':p>=80?'y':'r'; }
function sigLabel(s){ return s==='g'?'◎ 良好':s==='y'?'△ 注意':s==='nd'?'－':'✕ 要対策'; }
function sigColor(s){ return s==='g'?'var(--green)':s==='y'?'var(--yellow)':s==='nd'?'var(--muted)':'var(--red)'; }
function fmt(n,d=1){ return n==null||isNaN(n)?'-':n.toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtP(n){ if(n==null||isNaN(n)) return '-'; return fmt(n,1)+'%'; }
function cumSum(arr,period){ const idx=MONTHS.indexOf(period); return arr.slice(0,idx+1).reduce((s,v)=>s+(v||0),0); }
function kpiProg(actArr,budArr,period,low=false){
  const a=cumSum(actArr,period), b=cumSum(budArr,period);
  return {act:a,bud:b,prog:calcProg(a,b,low)};
}
function kpiAvg(actArr,budArr,period,low=false){
  const idx=MONTHS.indexOf(period)+1;
  const as=actArr.slice(0,idx).filter(v=>v!==0&&!isNaN(v));
  const bs=budArr.slice(0,idx).filter(v=>v!==0&&!isNaN(v));
  const a=as.length?as.reduce((s,v)=>s+v,0)/as.length:0;
  const b=bs.length?bs.reduce((s,v)=>s+v,0)/bs.length:0;
  return {act:a,bud:b,prog:calcProg(a,b,low)};
}

let PERIOD='2026/3/1';
let CUR_FILTER='ALL';
let CHARTS={};

function companyProfit(co,period){
  let actArr,budArr;
  if(co==='ENEOS'){
    actArr=MONTHS.map((_,i)=>Object.values(E_PL).reduce((s,v)=>s+(v.act[i]||0),0));
    budArr=MONTHS.map((_,i)=>Object.values(E_PL).reduce((s,v)=>s+(v.bud[i]||0),0));
  } else if(co==='ERE'){
    actArr=ERE_PL.act; budArr=ERE_PL.bud;
  } else if(co==='マテリアル'){
    actArr=MONTHS.map((_,i)=>Object.values(ENS_PL).reduce((s,v)=>s+(v.act[i]||0),0));
    budArr=MONTHS.map((_,i)=>Object.values(ENS_PL).reduce((s,v)=>s+(v.bud[i]||0),0));
  } else if(co==='Power'){
    actArr=MONTHS.map((_,i)=>Object.values(PWR_PL).reduce((s,v)=>s+(v.act[i]||0),0));
    budArr=MONTHS.map((_,i)=>Object.values(PWR_PL).reduce((s,v)=>s+(v.bud[i]||0),0));
  } else if(co==='Xplora'){
    actArr=XPL_PL.act; budArr=XPL_PL.bud;
  } else {
    actArr=OTHER_PL.act; budArr=OTHER_PL.bud;
  }
  const a=cumSum(actArr,period), b=cumSum(budArr,period), p=calcProg(a,b);
  return {act:a,bud:b,prog:p,s:sig(p),actArr,budArr};
}

  row('ENS_PL_total','マテリアル','損益','営業利益','合計','億円',ensActArr,ensBudArr);
  row('ENS_COST','マテリアル','損益','経費','合計','億円',COST.マテリアル.act,COST.マテリアル.bud,true,false);
  Object.entries(ENS_PL).forEach(([k,v])=>row('ENS_PL_'+k,'マテリアル','損益','事業別利益',k,'億円',v.act,v.bud));
  Object.entries(ENS_RELCO).forEach(([k,v])=>row('ENS_RELCO_'+k,'マテリアル','損益','関係会社利益',k,'億円',v.act,v.bud));
  Object.entries(ENS_SEL).forEach(([k,v])=>row('ENS_SEL_'+k,'マテリアル','販売','販売量',k,'KT',v.act,v.bud));
  row('ENS_OEE','マテリアル','製造','OEE','月次平均（EMSR）','%',ENS_OEE.act,ENS_OEE.bud,false,true);

  // Power
  const pwrActArr=MONTHS.map((_,i)=>Object.values(PWR_PL).reduce((s,v)=>s+v.act[i],0));
  const pwrBudArr=MONTHS.map((_,i)=>Object.values(PWR_PL).reduce((s,v)=>s+v.bud[i],0));
  row('PWR_PL_total','Power','損益','営業利益','合計','億円',pwrActArr,pwrBudArr);
  row('PWR_COST','Power','損益','経費','合計','億円',COST.Power.act,COST.Power.bud,true,false);
  Object.entries(PWR_PL).forEach(([k,v])=>row('PWR_PL_'+k,'Power','損益','事業別利益',k,'億円',v.act,v.bud));
  row('PWR_GEN','Power','製造','発電量','合計','億kwh',PWR_GEN.act,PWR_GEN.bud);
  row('PWR_GENCOST','Power','製造','発電費用','平均単価','円/kwh',PWR_GENCOST.act,PWR_GENCOST.bud,true,true);
  row('PWR_UCL','Power','製造','UCL','五井/川天/室蘭バイオマス','%',PWR_UCL_DATA.act,PWR_UCL_DATA.bud,true,true);
  Object.entries(PWR_SEL).forEach(([k,v])=>row('PWR_SEL_'+k,'Power','販売','販売量',k,'億kwh',v.act,v.bud));
  Object.entries(PWR_PRICE).forEach(([k,v])=>row('PWR_PRICE_'+k,'Power','販売','売価',k,'円/kwh',v.act,v.bud,false,true));
  Object.entries(PWR_MARGIN).forEach(([k,v])=>row('PWR_MARGIN_'+k,'Power','販売','限界利益',k,'円/kwh',v.act,v.bud,false,true));

  // Xplora
  row('XPL_PL','Xplora','損益','営業利益','合計','億円',XPL_PL.act,XPL_PL.bud);
  row('XPL_COST','Xplora','損益','経費','合計','億円',COST.Xplora.act,COST.Xplora.bud,true,false);
  Object.entries(XPL_PROD_LOC).forEach(([k,v])=>row('XPL_LOC_'+k,'Xplora','製造','生産量',k,'千BOED',v.act,v.bud,false,true));

  // その他
  row('OTH_PL','その他','損益','営業利益','合計','億円',OTHER_PL.act,OTHER_PL.bud);
  row('OTH_COST','その他','損益','経費','合計','億円',COST.その他.act,COST.その他.bud,true,false);

  return R;
}

function calcRow(r){
  if(r.nodata||!r.actArr||r.actArr.length===0) return {act:NaN,bud:NaN,prog:NaN,s:'nd'};
  if(r.id==='ENS_OEE'){
    const idx=MONTHS.indexOf(PERIOD)+1;
    const as=r.actArr.slice(0,idx).filter(v=>v>0);
    const a=as.length?as.reduce((s,v)=>s+v,0)/as.length:0;
    const b=r.budArr[0];
    const p=calcProg(a,b,false); return {act:a,bud:b,prog:p,s:sig(p)};
  }
  if(r.avg){
    const res=kpiAvg(r.actArr,r.budArr,PERIOD,r.low);
    return {...res,s:sig(res.prog)};
  }
  const res=kpiProg(r.actArr,r.budArr,PERIOD,r.low);
  return {...res,s:sig(res.prog)};
}

// ===== HD GRID =====
function renderHDGrid(){
  const cos=['ENEOS','Xplora','マテリアル','Power','ERE','その他'];
  const hdD=cos.map(c=>companyProfit(c,PERIOD));
  const totalAct=hdD.reduce((s,d)=>s+d.act,0);
  const totalBud=hdD.reduce((s,d)=>s+d.bud,0);
  const tp=calcProg(totalAct,totalBud), ts=sig(tp);

  let html=`<div class="hd-card" onclick="setFilterById('ALL')">
    <div class="hd-card-top" style="background:linear-gradient(90deg,#60A5FA,#60A5FA44)"></div>
    <div class="hd-co-name" style="color:#60A5FA">HD 合計</div>
    <div class="hd-profit" style="color:${sigColor(ts)}">${fmt(totalAct)}<span style="font-size:10px;color:var(--muted);margin-left:3px">億円</span></div>
    <div class="hd-budget">予算 ${fmt(totalBud)} 億円</div>
    <div class="hd-prog" style="color:${sigColor(ts)}">${fmtP(tp)} <span class="sdot ${ts}"></span></div>
  </div>`;
  html+=cos.map((co,ci)=>{
    const d=hdD[ci], c=CO_COLOR[co];
    return `<div class="hd-card" onclick="setFilterById('${co}')">
      <div class="hd-card-top" style="background:linear-gradient(90deg,${c},${c}44)"></div>
      <div class="hd-co-name" style="color:${c}">${co}</div>
      <div class="hd-profit" style="color:${sigColor(d.s)}">${fmt(d.act)}<span style="font-size:10px;color:var(--muted);margin-left:3px">億円</span></div>
      <div class="hd-budget">予算 ${fmt(d.bud)} 億円</div>
      <div class="hd-prog" style="color:${sigColor(d.s)}">${fmtP(d.prog)} <span class="sdot ${d.s}"></span></div>
    </div>`;
  }).join('');
  document.getElementById('hdGrid').innerHTML=html;
}

// ===== TABLE =====
function renderTable(){
  const query=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const all=buildAllKpis();
  const SEC_ORDER=['損益','販売','製造'];
  const COS_ORDER=['HD','ENEOS','Xplora','マテリアル','Power','ERE','その他'];
  const rows=all.filter(r=>{
    if(CUR_FILTER!=='ALL'&&r.co!==CUR_FILTER) return false;
    if(query&&!(r.name+r.cat+r.co).toLowerCase().includes(query)) return false;
    return true;
  }).sort((a,b)=>{
    const coIdx=x=>{const i=COS_ORDER.indexOf(x); return i<0?99:i;};
    const secIdx=x=>{const i=SEC_ORDER.indexOf(x); return i<0?99:i;};
    const ci=coIdx(a.co)-coIdx(b.co);
    if(ci!==0) return ci;
    const si=secIdx(a.sec)-secIdx(b.sec);
    if(si!==0) return si;
    return a.cat.localeCompare(b.cat,'ja');
  });

  document.getElementById('rowCount').textContent=rows.length+' 件表示中（全 '+all.length+' 件）';

  let prevCo='';
  document.getElementById('kpiTbody').innerHTML=rows.length?rows.map(r=>{
    const isFirst=r.co!==prevCo; prevCo=r.co;
    const {act,bud,prog,s}=calcRow(r);
    const diff=(!isNaN(act)&&!isNaN(bud))?act-bud:NaN;
    const bw=Math.min(Math.max(isNaN(prog)?0:prog,0),115);
    const c=CO_COLOR[r.co]||'#4A9EFF', bg=CO_BG[r.co]||'transparent';
    const badges=(r.avg?'<span class="avg-badge">平均</span>':'')+(r.low?'<span class="low-badge">低↓良</span>':'');
    const coCell='<span class="co-badge" style="background:'+bg+';color:'+c+';border:1px solid '+c.replace(')',',0.3)').replace('rgb','rgba')+'">'+r.co+'</span>';

    if(r.nodata){
      return '<tr class="nodata-row'+(isFirst?' co-group-start':'')+'"><td>'+coCell+'</td><td>'+r.sec+'</td><td>'+r.cat+'</td><td>'+r.name+'</td><td></td><td class="nodata-cell" colspan="5">データなし（CSV未収録）</td></tr>';
    }
    const diffCls=isNaN(diff)?'zero':diff>0?'pos':diff<0?'neg':'zero';
    return '<tr class="'+(isFirst?'co-group-start':'')+'" onclick="openModal(\''+r.id+'\')">'
      +'<td>'+coCell+'</td>'
      +'<td>'+r.sec+'</td>'
      +'<td>'+r.cat+'</td>'
      +'<td>'+r.name+badges+'</td>'
      +'<td>'+r.unit+'</td>'
      +'<td class="num-act">'+fmt(act)+'</td>'
      +'<td class="num-bud">'+fmt(bud)+'</td>'
      +'<td class="num-diff '+diffCls+'">'+(isNaN(diff)?'-':fmt(diff))+'</td>'
      +'<td><span class="num-prog '+s+'">'+fmtP(prog)+'</span>'
        +'<span class="prog-mini"><span class="prog-mini-fill '+s+'" style="width:'+bw+'%"></span></span></td>'
      +'<td style="text-align:center"><span class="sdot '+s+'" style="margin-right:4px"></span>'
        +'<span style="font-size:10px;color:'+sigColor(s)+';font-weight:600">'+sigLabel(s)+'</span></td>'
      +'</tr>';
  }).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:24px">該当する指標がありません</td></tr>';
}

// ===== FILTER =====
function setFilter(co,btn){
  CUR_FILTER=co;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderTable();
}
function setFilterById(co){
  CUR_FILTER=co;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  const id='fb_'+co;
  const btn=document.getElementById(id);
  if(btn) btn.classList.add('active');
  renderTable();
}

// ===== PERIOD =====
function initPeriodSel(){
  const sel=document.getElementById('periodSel');
  MONTHS.forEach(m=>{
    const p=m.split('/');
    const opt=document.createElement('option');
    opt.value=m;
    opt.textContent=p[0]+'年'+p[1]+'月（〜'+p[1]+'月 累計）';
    if(m===PERIOD) opt.selected=true;
    sel.appendChild(opt);
  });
}
function onPeriodChange(){ PERIOD=document.getElementById('periodSel').value; renderHDGrid(); renderTable(); }

// ===== MODAL =====
function destroyCharts(){ Object.values(CHARTS).forEach(c=>c.destroy()); CHARTS={}; }

function openModal(id){
  destroyCharts();
  const row=buildAllKpis().find(r=>r.id===id);
  if(!row||row.nodata||!row.actArr||row.actArr.length===0) return;
  document.getElementById('modalTitle').textContent=row.co+' ▸ '+row.cat+' ▸ '+row.name;
  document.getElementById('modalSub').textContent=row.sec+' / '+row.unit+' / FY2025 月次推移';
  renderModalContent(row);
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); destroyCharts(); }
function bgClose(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }

const COPT={responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#8aaac8',font:{size:11}}}},
  scales:{x:{ticks:{color:'#5577aa',font:{size:10}},grid:{color:'#121E2E'}},
          y:{ticks:{color:'#5577aa',font:{size:10}},grid:{color:'#121E2E'}}}};
function mkCOPT(ex){ return JSON.parse(JSON.stringify(Object.assign({},COPT,ex||{}))); }

function renderModalContent(row){
  const body=document.getElementById('modalBody');
  const actArr=row.actArr, budArr=row.budArr;
  const color=CO_COLOR[row.co]||'#4A9EFF';
  const progs=MONTHS.map((_,i)=>calcProg(actArr[i],budArr[i],row.low));
  let ca=0,cb=0;
  const cumA=actArr.map(v=>{ca+=v;return ca;});
  const cumB=budArr.map(v=>{cb+=v;return cb;});

  body.innerHTML=
    '<div class="chart-sec-lbl">月次推移（実績 vs 予算）</div>'
    +'<div class="chart-wrap h280"><canvas id="mc1"></canvas></div>'
    +'<div class="chart-row2" style="margin-top:18px">'
      +'<div><div class="chart-sec-lbl">累計推移</div><div class="chart-wrap h220"><canvas id="mc2"></canvas></div></div>'
      +'<div><div class="chart-sec-lbl">月次進捗率</div><div class="chart-wrap h220"><canvas id="mc3"></canvas></div></div>'
    +'</div>'
    +'<table class="modal-table"><thead><tr><th>月</th><th>実績 ('+row.unit+')</th><th>予算 ('+row.unit+')</th><th>差異</th><th>進捗率</th></tr></thead><tbody>'
    +MONTHS.map(function(m,i){
      var p=progs[i]; var sc=isNaN(p)?'var(--muted)':sigColor(sig(p));
      var d=actArr[i]-budArr[i];
      return '<tr><td>'+ML[i]+'</td><td>'+fmt(actArr[i])+'</td><td>'+fmt(budArr[i])+'</td>'
        +'<td style="color:'+(d>=0?'var(--green)':'var(--red)')+'">'+fmt(d)+'</td>'
        +'<td style="color:'+sc+';font-weight:700">'+fmtP(p)+'</td></tr>';
    }).join('')+'</tbody></table>';

  setTimeout(function(){
    CHARTS.c1=new Chart(document.getElementById('mc1').getContext('2d'),{type:'bar',data:{labels:ML,datasets:[
      {label:'予算',data:budArr,backgroundColor:'#1E406066',type:'bar'},
      {label:'実績',data:actArr,backgroundColor:color+'bb',type:'bar'},
      {label:'進捗率(%)',data:progs.map(function(p){return isNaN(p)?null:p;}),borderColor:'#FBBF2488',type:'line',yAxisID:'y2',tension:0.3,pointRadius:3,spanGaps:true}
    ]},options:Object.assign(mkCOPT(),{scales:{
      x:{ticks:{color:'#5577aa',font:{size:10}},grid:{color:'#121E2E'}},
      y:{ticks:{color:'#5577aa',font:{size:10}},grid:{color:'#121E2E'},title:{display:true,text:row.unit,color:'#5577aa'}},
      y2:{position:'right',ticks:{color:'#FBBF2466',callback:function(v){return v.toFixed(0)+'%';}},grid:{display:false}}
    }})});
    CHARTS.c2=new Chart(document.getElementById('mc2').getContext('2d'),{type:'line',data:{labels:ML,datasets:[
      {label:'予算累計',data:cumB,borderColor:'#446688',backgroundColor:'#44668822',fill:true,tension:0.3},
      {label:'実績累計',data:cumA,borderColor:color,backgroundColor:color+'22',fill:true,tension:0.3}
    ]},options:mkCOPT()});
    CHARTS.c3=new Chart(document.getElementById('mc3').getContext('2d'),{type:'bar',data:{labels:ML,datasets:[{label:'進捗率',
      data:progs.map(function(p){return isNaN(p)?null:p;}),
      backgroundColor:progs.map(function(p){return isNaN(p)?'#2a3858':p>=100?'#34D39988':p>=80?'#FBBF2488':'#F8717188';}),
      borderColor:progs.map(function(p){return isNaN(p)?'#2a3858':p>=100?'#34D399':p>=80?'#FBBF24':'#F87171';}),borderWidth:1
    }]},options:Object.assign(mkCOPT({plugins:{legend:{display:false}}}),{
      scales:{x:{ticks:{color:'#5577aa',font:{size:10}},grid:{color:'#121E2E'}},
              y:{ticks:{color:'#5577aa',font:{size:10},callback:function(v){return v+'%';}},grid:{color:'#121E2E'}}}})});
  },30);
}

// ===== INIT =====
function init(){
  document.getElementById('updTime').textContent='更新: '+new Date().toLocaleDateString('ja-JP');
  initPeriodSel();
  renderHDGrid();
  renderTable();
}
window.addEventListener('DOMContentLoaded',init);
</script>
