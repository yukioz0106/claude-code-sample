<style>

/* ---- toolbar ---- */

<script>
// ---- 暗号化ユーティリティ (AES-GCM + PBKDF2) ----
async function deriveKey(password, salt) {
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJson(jsonStr, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt(
    {name:'AES-GCM', iv}, key, new TextEncoder().encode(jsonStr)));
  const out = new Uint8Array(4 + 16 + 12 + cipher.length);
  out.set([0x48,0x52,0x50,0x57], 0); // magic "HRPW"
  out.set(salt, 4);
  out.set(iv, 20);
  out.set(cipher, 32);
  let s = '';
  for (let i = 0; i < out.length; i++) s += String.fromCharCode(out[i]);
  return btoa(s);
}
async function decryptJson(b64, password) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  if (bytes[0]!==0x48||bytes[1]!==0x52||bytes[2]!==0x50||bytes[3]!==0x57)
    throw new Error('形式が不正です');
  const key = await deriveKey(password, bytes.slice(4,20));
  const plain = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: bytes.slice(20,32)}, key, bytes.slice(32));
  return new TextDecoder().decode(plain);
}
function isEncrypted(text) {
  try {
    const b = Uint8Array.from(atob(text.trim()), c => c.charCodeAt(0));
    return b[0]===0x48 && b[1]===0x52 && b[2]===0x50 && b[3]===0x57;
  } catch { return false; }
}

// ---- グレードカラー ----
const GRADE_COLOR_MAP = {
  "BL3":"#4527A0","BL4":"#6A1B9A","BL5":"#1565C0","BL6":"#1976D2","BL7":"#1E88E5",
  "E1":"#00695C","E2":"#00796B","E3":"#2E7D32","E3+":"#388E3C",
  "S1":"#BF6900","S2":"#BF360C","S3":"#E65100","S4":"#4E342E","S5":"#546E7A",
  "SS1":"#37474F","SS2":"#455A64","SS3":"#546E7A","SS3+":"#607D8B","SS4":"#78909C","SS5":"#90A4AE",
};

function zen2han(str) {
  return String(str || '').replace(/[Ａ-Ｚａ-ｚ０-９＋]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
}
function gradeCodeOf(emp) {
  const clean = s => zen2han(String(s || '')).replace(/\s*\(.*\)/, '').trim();
  const t = clean(emp['等級名称']); if (t && t !== '-') return t;
  const s = clean(emp['資格']); if (s && s !== '-' && s !== '再雇用契約社員') return s;
  const y = clean(emp['役割グレード名称']); if (y && y !== '-') return y;
  return '';
}
function gradeColor(emp) { return GRADE_COLOR_MAP[gradeCodeOf(emp)] || '#607D8B'; }

const GRADE_RANK = {
  "BL3":85,"BL4":80,"BL5":75,"BL6":70,"BL7":65,
  "E1":60,"E2":55,"E3+":52,"E3":50,
  "S1":40,"S2":35,"S3":30,"S4":25,"S5":20,
  "SS1":15,"SS2":14,"SS3+":13,"SS3":12,"SS4":11,"SS5":10,
};
function gradeSortKey(emp) { return -(GRADE_RANK[gradeCodeOf(emp)] || 0); }

const TOOLTIP_FIELDS = [
  "社員番号","社員名称","社内呼称","等級名称","役割グレード名称","役職名称",
  "所属名称","チーム名","社員区分","コース区分名称","資格","ポジション名称",
  "性別","生年月日","入社日付","勤続年数(休職控除)",
  "採用区分","学歴形態区分","学校名称","学部名称","学科名称",
  "婚姻区分","総扶養人数（税法上）","TOEIC（スコア）","管轄人事"
];

const FIXED_ROLES = ["dept_head","vp1","vp2"];

// ---- state ----
const state = {
  dept_name: "",
  pos_labels: { dept_head:"部長", vp1:"副部長", vp2:"副部長" },
  employees: [],
};
let _initData = null;

// ============================================================
// グループ・チーム定義の構築
// ============================================================

function buildGroupDefs(employees) {
  const deptShozoku = new Set();
  for (const emp of employees) {
    const yaku = String(emp['役職名称'] || '').trim();
    if (yaku === '部長' || yaku === '副部長') deptShozoku.add(String(emp['所属名称'] || '').trim());
  }

  const seenG = new Set();
  const groupNames = [];
  for (const emp of employees) {
    const s = String(emp['所属名称'] || '').trim();
    if (s && !deptShozoku.has(s) && !seenG.has(s)) { seenG.add(s); groupNames.push(s); }
  }

  const deptPrefix = [...deptShozoku][0] || '';
  const shortOf = name => (deptPrefix && name.startsWith(deptPrefix))
    ? (name.slice(deptPrefix.length).replace(/^[\s　]+/, '') || name)
    : name;

  return groupNames.map((fullName, gi) => {
    const gid = 'g' + (gi + 1);
    const gmRole = 'gm' + (gi + 1);

    const seenT = new Set();
    const teamNames = [];
    for (const emp of employees) {
      if (String(emp['所属名称'] || '').trim() !== fullName) continue;
      const t = String(emp['チーム名'] || '').trim();
      if (t && !seenT.has(t)) { seenT.add(t); teamNames.push(t); }
    }

    const teams = teamNames.map((tName, ti) => ({
      tid: gid + '_t' + (ti + 1),
      name: tName,
      tlRole: gid + '_tl' + (ti + 1),
    }));

    return { gid, name: fullName, shortName: shortOf(fullName), gmRole, teams };
  });
}

// ============================================================
// 自動割り当て
// ============================================================
function autoAssign(employees) {
  const defs = buildGroupDefs(employees);
  const shozokuToGid = {};
  const shozokuTeamToTid = {};
  for (const d of defs) {
    shozokuToGid[d.name] = d.gid;
    for (const t of d.teams) shozokuTeamToTid[d.name + '\0' + t.name] = t.tid;
  }

  for (const emp of employees) { emp['_role'] = 'member'; emp['_group'] = null; emp['_team'] = null; }

  // 部長
  for (const emp of employees) {
    if (String(emp['役職名称'] || '').trim() === '部長') { emp['_role'] = 'dept_head'; break; }
  }
  // 副部長
  let vpIdx = 1;
  for (const emp of employees) {
    if (emp['_role'] !== 'member') continue;
    if (String(emp['役職名称'] || '').trim() === '副部長' && vpIdx <= 2) {
      emp['_role'] = 'vp' + vpIdx++; emp['_group'] = null;
    }
  }
  // グループ GM
  const gmFilled = new Set();
  for (const d of defs) {
    for (const priority of ['グループマネージャー', 'チームリーダー']) {
      if (gmFilled.has(d.gid)) break;
      for (const emp of employees) {
        if (emp['_role'] !== 'member') continue;
        const shozoku = String(emp['所属名称'] || '').trim();
        const teamName = String(emp['チーム名'] || '').trim();
        const yaku = String(emp['役職名称'] || '').trim();
        if (shozoku === d.name && !teamName && yaku === priority) {
          emp['_role'] = d.gmRole; gmFilled.add(d.gid); break;
        }
      }
    }
  }
  // チーム TL
  const tlFilled = new Set();
  for (const d of defs) {
    for (const t of d.teams) {
      for (const emp of employees) {
        if (emp['_role'] !== 'member') continue;
        const shozoku = String(emp['所属名称'] || '').trim();
        const teamName = String(emp['チーム名'] || '').trim();
        const yaku = String(emp['役職名称'] || '').trim();
        if (shozoku === d.name && teamName === t.name && yaku === 'チームリーダー' && !tlFilled.has(t.tid)) {
          emp['_role'] = t.tlRole; tlFilled.add(t.tid); break;
        }
      }
    }
  }
  // 残りメンバー
  for (const emp of employees) {
    if (emp['_role'] !== 'member') continue;
    const shozoku = String(emp['所属名称'] || '').trim();
    const teamName = String(emp['チーム名'] || '').trim();
    const gid = shozokuToGid[shozoku] || null;
    const tid = teamName ? (shozokuTeamToTid[shozoku + '\0' + teamName] || null) : null;
    emp['_group'] = gid;
    emp['_team'] = tid;
  }
}

// ============================================================
// computeOrgData
// ============================================================
function computeOrgData() {
  const defs = buildGroupDefs(state.employees);
  const allTlRoles = defs.flatMap(d => d.teams.map(t => t.tlRole));
  const allGmRoles = defs.map(d => d.gmRole);
  const allRoles = [...FIXED_ROLES, ...allGmRoles, ...allTlRoles];

  const assignments = {};
  const groupMembers = {};
  const teamMembers = {};
  for (const d of defs) {
    groupMembers[d.gid] = [];
    for (const t of d.teams) teamMembers[t.tid] = [];
  }
  const unassigned = [];

  for (const emp of state.employees) {
    const role = String(emp['_role'] || 'member');
    if (allRoles.includes(role)) {
      assignments[role] = emp;
    } else if (role === 'member') {
      const gid = emp['_group'];
      const tid = emp['_team'];
      if (tid && teamMembers[tid]) teamMembers[tid].push(emp);
      else if (gid && groupMembers[gid]) groupMembers[gid].push(emp);
      else unassigned.push(emp);
    } else {
      unassigned.push(emp);
    }
  }
  for (const d of defs) {
    groupMembers[d.gid].sort((a,b) => gradeSortKey(a) - gradeSortKey(b));
    for (const t of d.teams) teamMembers[t.tid].sort((a,b) => gradeSortKey(a) - gradeSortKey(b));
  }

  return { dept_name: state.dept_name, pos_labels: {...state.pos_labels}, defs, assignments, groupMembers, teamMembers, unassigned };
}

// ---- tooltip ----
function showTooltip(e, emp) {
  const t = document.getElementById('tooltip');
  const rows = TOOLTIP_FIELDS.map(f => {
    const v = emp[f]; if (v === null || v === undefined || v === '') return '';
    return `<tr><td>${esc(f)}</td><td>${esc(String(v))}</td></tr>`;
  }).filter(Boolean).join('');
  t.innerHTML = `<table>${rows}</table>`; t.style.display = 'block'; moveTooltip(e);
}
function moveTooltip(e) {
  const t = document.getElementById('tooltip');
  let x = e.clientX + 14, y = e.clientY + 10;
  if (x + 310 > window.innerWidth) x = e.clientX - 315;
  if (y + t.offsetHeight > window.innerHeight) y = e.clientY - t.offsetHeight - 6;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

// ---- drag & drop ----
function setupDropZone(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); handleDrop(el); });
}
function startDrag(e, emp) {
  e.preventDefault();
  e.stopPropagation();
  // 重複登録を防ぐため、既存リスナーを除去してから追加
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  dragEmp = emp;
  const rect = e.currentTarget.getBoundingClientRect();
  dragOffX = e.clientX - rect.left; dragOffY = e.clientY - rect.top;
  ghost.style.background = gradeColor(emp);
  document.getElementById('ghost-name').textContent = (emp['社内呼称'] || emp['社員名称'] || '').slice(0,6);
  document.getElementById('ghost-grade').textContent = gradeCodeOf(emp);
  ghost.style.display = 'block';
  ghost.style.left = (e.clientX - dragOffX) + 'px'; ghost.style.top = (e.clientY - dragOffY) + 'px';
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
  hideTooltip();
}
function onDragMove(e) {
  ghost.style.left = (e.clientX - dragOffX) + 'px'; ghost.style.top = (e.clientY - dragOffY) + 'px';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const el = findDropZoneAt(e.clientX, e.clientY); if (el) el.classList.add('drag-over');
}
function onDragEnd(e) {
  document.removeEventListener('mousemove', onDragMove); document.removeEventListener('mouseup', onDragEnd);
  ghost.style.display = 'none';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (!dragEmp) return;
  const el = findDropZoneAt(e.clientX, e.clientY); if (el) handleDrop(el);
  dragEmp = null;
}
function findDropZoneAt(cx, cy) {
  for (const el of document.elementsFromPoint(cx, cy)) {
    if (el.dataset && (el.dataset.drop || el.dataset.dropGid || el.dataset.dropTid)) return el;
  }
  return null;
}

function handleDrop(target) {
  if (!dragEmp || !target) return;
  const dropType = target.dataset.drop;
  const dropGid  = target.dataset.dropGid || null;
  const dropTid  = target.dataset.dropTid || null;
  // dragEmp はオブジェクト参照なので state.employees 内の同一オブジェクトを直接参照
  const emp = state.employees.find(e => e === dragEmp);
  if (!emp) return;

  const defs = buildGroupDefs(state.employees);
  const allTlRoles = defs.flatMap(d => d.teams.map(t => t.tlRole));
  const allGmRoles = defs.map(d => d.gmRole);
  const allRoles = [...FIXED_ROLES, ...allGmRoles, ...allTlRoles];

  if (allRoles.includes(dropType)) {
    for (const e of state.employees) {
      if (String(e['_role']) === dropType && String(e['社員番号']) !== String(empId)) {
        e['_role'] = 'member'; e['_group'] = null; e['_team'] = null;
      }
    }
    emp['_role'] = dropType; emp['_group'] = null; emp['_team'] = null;
    if (state.pos_labels[dropType]) emp['役職名称'] = state.pos_labels[dropType];
  } else if (dropType === 'team' && dropTid) {
    emp['_role'] = 'member'; emp['_team'] = dropTid;
    const def = defs.find(d => d.teams.some(t => t.tid === dropTid));
    emp['_group'] = def ? def.gid : null;
  } else if (dropType === 'group' && dropGid) {
    emp['_role'] = 'member'; emp['_group'] = dropGid; emp['_team'] = null;
  } else if (dropType === 'unassigned') {
    emp['_role'] = 'member'; emp['_group'] = null; emp['_team'] = null;
  }

  loadOrg();
  setStatus(`${dragEmp['社内呼称'] || dragEmp['社員名称']} を移動しました`);
}

function downloadBlob(text, filename, mimeType) {
  const blob = new Blob([text], {type: mimeType});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ---- Excel 読み込み ----
function parseXlsx(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if (!rows.length) { reject(new Error('データが見つかりませんでした')); return; }
        const emps = rows.map(raw => {
          const emp = {};
          for (const [k,v] of Object.entries(raw)) emp[k.replace(/[\s\n\r]/g,'')] = v;
          if (!emp['_role']) emp['_role'] = 'member';
          if (!('_group' in emp)) emp['_group'] = null;
          if (!('_team' in emp)) emp['_team'] = null;
          return emp;
        });
        resolve({emps, fileName: file.name});
      } catch(err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('ファイル読み込み失敗'));
    reader.readAsArrayBuffer(file);
  });
}

function applyEmployees(emps) {
  const defs = buildGroupDefs(emps);
  const validGids = new Set(defs.map(d => d.gid));
  const validTids = new Set(defs.flatMap(d => d.teams.map(t => t.tid)));
  const needsAssign = !emps.some(e => FIXED_ROLES.includes(String(e['_role'])));
  const hasInvalidGroup = emps.some(e => (e['_group'] !== null && !validGids.has(String(e['_group'])))
                                      || (e['_team']  !== null && !validTids.has(String(e['_team']))));
  if (needsAssign || hasInvalidGroup) autoAssign(emps);

  state.employees = emps;
  const deptEmp = emps.find(e => String(e['役職名称']||'').trim() === '部長');
  state.dept_name = (deptEmp?.['所属名称']) ? String(deptEmp['所属名称']).trim() : (emps[0]?.['所属名称'] || '');
  for (const d of defs) { if (!state.pos_labels[d.gmRole]) state.pos_labels[d.gmRole] = 'グループマネージャー'; }
}

let _pendingJsonText = null, _pendingJsonFileName = null;

function onJsonSelected(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result.replace(/^﻿/, '');
    if (isEncrypted(text.trim())) {
      _pendingJsonText = text.trim();
      _pendingJsonFileName = file.name;
      document.getElementById('open-pw').value = '';
      document.getElementById('open-pw-error').textContent = '';
      document.getElementById('open-pw-filename').textContent = `ファイル: ${file.name}`;
      document.getElementById('open-pw-dialog').classList.remove('hidden');
      setTimeout(() => document.getElementById('open-pw').focus(), 50);
    } else {
      applyJsonText(text, file.name);
    }
  };
  reader.onerror = () => setStatus('ファイル読み込み失敗');
  reader.readAsText(file, 'utf-8');
}
async function execOpenJson() {
  const pw  = document.getElementById('open-pw').value;
  const err = document.getElementById('open-pw-error');
  if (!pw) { err.textContent = 'パスワードを入力してください。'; return; }
  try {
    const text = await decryptJson(_pendingJsonText, pw);
    closeOpenDialog();
    applyJsonText(text, _pendingJsonFileName);
  } catch {
    err.textContent = 'パスワードが正しくないか、ファイルが破損しています。';
    document.getElementById('open-pw').select();
  }
}
function closeOpenDialog() {
  document.getElementById('open-pw-dialog').classList.add('hidden');
  _pendingJsonText = null; _pendingJsonFileName = null;
}
function applyJsonText(text, fileName) {
  try {
    const parsed = JSON.parse(text);
    if (!parsed.employees || !Array.isArray(parsed.employees)) { setStatus('エラー: 不正な JSON 形式です'); return; }
    if (parsed.dept_name) state.dept_name = parsed.dept_name;
    if (parsed.pos_labels) Object.assign(state.pos_labels, parsed.pos_labels);
    state.employees = parsed.employees;
    document.getElementById('open-overlay').classList.add('hidden');
    loadOrg();
    setStatus(`${fileName} を読み込みました (${parsed.employees.length}名)`);
  } catch(e) { setStatus('JSON 読み込みエラー: ' + e.message); }
}

function onXlsxSelected(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  parseXlsx(file)
    .then(({emps, fileName}) => { applyEmployees(emps); document.getElementById('open-overlay').classList.add('hidden'); loadOrg(); setStatus(`${fileName} を読み込みました (${emps.length}名)`); })
    .catch(err => setStatus('読み込みエラー: ' + err.message));
}

// ---- 初期化：xlsx → JSON 変換 ----
function onInitXlsxSelected(event) {
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  parseXlsx(file)
    .then(({emps, fileName}) => {
      autoAssign(emps);
      const defs = buildGroupDefs(emps);
      const deptEmp = emps.find(e => String(e['役職名称']||'').trim() === '部長');
      const deptName = (deptEmp?.['所属名称']) ? String(deptEmp['所属名称']).trim() : (emps[0]?.['所属名称'] || '部門');
      const posLabels = { dept_head:'部長', vp1:'副部長', vp2:'副部長' };
      for (const d of defs) posLabels[d.gmRole] = 'グループマネージャー';
      _initData = { dept_name: deptName, pos_labels: posLabels, employees: emps };
      const teamInfo = defs.map(d => d.teams.length ? `${d.shortName}(${d.teams.length}チーム)` : d.shortName).join('、');
      document.getElementById('init-msg').innerHTML =
        `<b>${esc(fileName)}</b> を読み込みました<br>${emps.length}名 / ${defs.length}グループ<br>${esc(teamInfo)}<br><br>JSONをダウンロードするか、そのまま編集を開始できます。`;
      const suggestedJsonName = fileName.replace(/\.[^.]+$/, '') + '.json';
      spUpdateInitDialog(suggestedJsonName);
      document.getElementById('init-progress').classList.remove('hidden');
    })
    .catch(err => setStatus('初期化エラー: ' + err.message));
}
async function downloadInitJson() {
  if (!_initData) return;
  const pw  = document.getElementById('init-pw').value;
  const pw2 = document.getElementById('init-pw-confirm').value;
  const err = document.getElementById('init-pw-error');
  if (!pw)        { err.textContent = 'パスワードを入力してください。'; return; }
  if (pw !== pw2) { err.textContent = 'パスワードが一致しません。'; return; }
  err.textContent = '';
  try {
    const encrypted = await encryptJson(JSON.stringify(_initData, null, 2), pw);
    const jsonName = (document.getElementById('init-sp-save-filename').textContent || '人事基本情報.json');
    const toSP = _sp.isSP && document.getElementById('init-sp-save-chk').checked;
    if (toSP) {
      err.textContent = 'SharePointへ保存中...';
      await spSaveInitJson(encrypted, jsonName);
      err.textContent = '';
      setStatus(`SharePoint に ${jsonName}（パスワード保護）として保存しました`);
    }
    // ローカルにもダウンロード（SP保存有無に関わらず）
    downloadBlob(encrypted, jsonName, 'text/plain;charset=utf-8');
    if (!toSP) setStatus(`${jsonName}（パスワード保護）としてダウンロードしました`);
  } catch(e) { err.textContent = '保存エラー: ' + e.message; }
}
function loadInitData() {
  if (!_initData) return;
  state.dept_name = _initData.dept_name;
  Object.assign(state.pos_labels, _initData.pos_labels);
  state.employees = _initData.employees;
  _initData = null;
  document.getElementById('init-progress').classList.add('hidden');
  document.getElementById('open-overlay').classList.add('hidden');
  loadOrg();
  setStatus(`初期化完了 - ${state.employees.length}名 (未保存 - 保存ボタンで JSON を出力してください)`);
}
function closeInitDialog() { document.getElementById('init-progress').classList.add('hidden'); _initData = null; }

// ============================================================
// SharePoint 連携
// ============================================================

// HTMファイル自身がSharePointに置かれている場合、window.locationから
// フォルダのサーバー相対パスとオリジンを取得する
function spContext() {
  const loc = window.location;
  // SharePointのURLパターン: https://tenant.sharepoint.com/sites/xxx/Shared Documents/folder/file.htm
  const m = loc.pathname.match(/^(.*\/)[^/]+\.htm?$/i);
  const folderPath = m ? m[1] : null; // 末尾スラッシュ付きサーバー相対パス
  const isSP = loc.hostname.toLowerCase().includes('sharepoint.com') && folderPath;
  return { origin: loc.origin, folderPath, isSP };
}

// SP REST API: フォルダ内のファイル一覧取得
async function spListFiles(origin, folderPath) {
  const encoded = encodeURIComponent(folderPath.replace(/\/$/, ''));
  const apiUrl = `${origin}${folderPath.split('/').slice(0,3).join('/')}/_api/web/GetFolderByServerRelativeUrl('${encoded}')/Files?$select=Name,TimeLastModified&$orderby=TimeLastModified%20desc`;
  const res = await fetch(apiUrl, {
    credentials: 'include',
    headers: { 'Accept': 'application/json;odata=nometadata' }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return (json.value || []).filter(f => /\.(json|xlsx?)$/i.test(f.Name));
}

// SP REST API: ファイルをテキストで取得
async function spFetchText(origin, folderPath, fileName) {
  const filePath = folderPath + fileName;
  const res = await fetch(`${origin}${filePath}`, { credentials: 'include', cache: 'no-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.text();
}

// SP REST API: ファイルをArrayBufferで取得
async function spFetchBuffer(origin, folderPath, fileName) {
  const filePath = folderPath + fileName;
  const res = await fetch(`${origin}${filePath}`, { credentials: 'include', cache: 'no-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.arrayBuffer();
}

// SP REST API: テキストファイルをPUTで保存
async function spPutFile(origin, folderPath, fileName, content) {
  const sitePath = folderPath.split('/').slice(0, 3).join('/'); // /sites/xxx
  const encoded = encodeURIComponent(folderPath.replace(/\/$/, ''));
  const apiUrl = `${origin}${sitePath}/_api/web/GetFolderByServerRelativeUrl('${encoded}')/Files/Add(url='${encodeURIComponent(fileName)}',overwrite=true)`;

  // X-RequestDigest が必要な場合はFormDigest取得
  let digest = '';
  try {
    const dr = await fetch(`${origin}${sitePath}/_api/contextinfo`, {
      method: 'POST', credentials: 'include',
      headers: { 'Accept': 'application/json;odata=nometadata' }
    });
    if (dr.ok) { const dj = await dr.json(); digest = dj.FormDigestValue || ''; }
  } catch {}

  const headers = { 'Content-Type': 'text/plain; charset=utf-8' };
  if (digest) headers['X-RequestDigest'] = digest;

  const res = await fetch(apiUrl, { method: 'POST', credentials: 'include', headers, body: content });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
}

// 起動時: SPコンテキストを検出して一覧を表示
const _sp = spContext();

async function spInitOpenOverlay() {
  if (!_sp.isSP) return;
  const section = document.getElementById('sp-open-section');
  section.classList.remove('hidden');
  const listEl = document.getElementById('sp-file-list');
  try {
    const files = await spListFiles(_sp.origin, _sp.folderPath);
    if (!files.length) { listEl.innerHTML = '<div class="sp-loading">このフォルダに .json / .xlsx ファイルはありません</div>'; return; }
    listEl.innerHTML = '';
    for (const f of files) {
      const ext = f.Name.match(/\.(json|xlsx?)$/i)?.[1]?.toLowerCase() || '';
      const date = f.TimeLastModified ? new Date(f.TimeLastModified).toLocaleString('ja-JP', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      const div = document.createElement('div');
      div.className = 'sp-file-item';
      div.innerHTML = `<span class="sp-file-ext ${ext==='json'?'json':'xlsx'}">${ext.toUpperCase()}</span><span class="sp-file-name">${esc(f.Name)}</span><span class="sp-file-date">${esc(date)}</span>`;
      div.onclick = () => spOpenFile(f.Name, ext);
      listEl.appendChild(div);
    }
  } catch(e) {
    listEl.innerHTML = `<div class="sp-loading">一覧取得エラー: ${esc(e.message)}</div>`;
  }
}

async function spOpenFile(fileName, ext) {
  setStatus(`${fileName} を読み込み中...`);
  try {
    if (ext === 'json') {
      const text = (await spFetchText(_sp.origin, _sp.folderPath, fileName)).replace(/^﻿/, '');
      if (isEncrypted(text.trim())) {
        _pendingJsonText = text.trim(); _pendingJsonFileName = fileName;
        document.getElementById('open-pw').value = '';
        document.getElementById('open-pw-error').textContent = '';
        document.getElementById('open-pw-filename').textContent = `ファイル: ${fileName}`;
        document.getElementById('open-pw-dialog').classList.remove('hidden');
        setTimeout(() => document.getElementById('open-pw').focus(), 50);
      } else {
        applyJsonText(text, fileName);
      }
    } else {
      const buf = await spFetchBuffer(_sp.origin, _sp.folderPath, fileName);
      const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if (!rows.length) throw new Error('データが見つかりませんでした');
      const emps = rows.map(raw => {
        const emp = {};
        for (const [k,v] of Object.entries(raw)) emp[k.replace(/[\s\n\r]/g,'')] = v;
        if (!emp['_role']) emp['_role'] = 'member';
        if (!('_group' in emp)) emp['_group'] = null;
        if (!('_team' in emp)) emp['_team'] = null;
        return emp;
      });
      applyEmployees(emps);
      document.getElementById('open-overlay').classList.add('hidden');
      loadOrg();
      setStatus(`${fileName} を読み込みました (${emps.length}名)`);
    }
  } catch(e) { setStatus(`読み込みエラー: ${e.message}`); }
}

// 保存ダイアログにSP情報を表示
function spUpdateSaveDialog() {
  if (!_sp.isSP) return;
  document.getElementById('save-sp-row').classList.remove('hidden');
  document.getElementById('save-sp-filename').textContent = '人事基本情報.json';

  await spPutFile(_sp.origin, _sp.folderPath, '人事基本情報.json', encrypted);

function spUpdateInitDialog(suggestedName) {
  if (!_sp.isSP) return;
  document.getElementById('init-sp-save-row').classList.remove('hidden');
  document.getElementById('init-sp-save-filename').textContent = suggestedName;
}

// 初期化時にSPへもアップロード
async function spSaveInitJson(encrypted, fileName) {
  if (!_sp.isSP) return;
  if (!document.getElementById('init-sp-save-chk').checked) return;
  await spPutFile(_sp.origin, _sp.folderPath, fileName, encrypted);
}
