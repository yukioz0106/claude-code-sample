# アカウント・ユーザー・Entra IDの設定は実行環境の環境変数から読み込みます。
SNOWFLAKE_ROLE: PDT_E1_H1_DATA_STEWARD_ROLE
SNOWFLAKE_WAREHOUSE: COMPUTE_H1_WH
SNOWFLAKE_DATABASE: PDT_PUBLIC_H1_DB
SNOWFLAKE_SCHEMA: PDT_PUBLIC_H1_SMSCGH102_SCHEMA
SNOWFLAKE_AUTHENTICATOR: oauth
# キャッシュはGit管理外に保存し、所有者だけが読み書きできます。
OAUTH_TOKEN_CACHE: ~/.snowflake/snowflake_oauth_token_cache.json
OAUTH_EXPIRY_MARGIN_SECONDS: 300
